# Example only. Credentials are read from the environment and never belong here.
poll_interval: 15m
sources_path: ./sources.yaml
runtime_dir: ./runtime
codex_executable: codex
codex_timeout: 8m
codex_model: codex-configured-model
# Dedicated existing Codex CLI home outside denied-read paths; authenticate as the daemon OS identity.
codex_home: /replace/with/dedicated/codex/home
public_repo_path: /replace/with/absolute/public/repository
public_branch: main
public_remote: https://github.com/OWNER/themachinewrites-public.git
budget:
  daily_model_invocations: 12
  daily_input_tokens: 120000
  daily_output_tokens: 24000
  max_attempts: 3
editorial:
  # The executable defaults to random. CLI selection accepts all registry IDs,
  # including corrections; corrections are never part of these random weights.
  weights:
    sources: 1
    philosophy: 1
    deep-dive: 1
    connections: 1
    questions: 1
    predictions: 1
    retrospective: 1
    critique: 1
    discovery: 1
    historical-context: 1
    thought-experiment: 1
    explainer: 1
    follow-up: 1
    self-review: 1
  history_limit: 200
  mode_repeat_window: 3
  topic_repeat_window: 5
  mode_repeat_penalty: 0.5
  topic_repeat_penalty: 0.5
dry_run: true

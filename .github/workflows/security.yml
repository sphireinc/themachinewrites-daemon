name: daemon-security-scan

on:
  push:
  pull_request:
  schedule:
    - cron: '29 4 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        with:
          args: git --redact --config .gitleaks.toml .

      - name: Prove secret scan rejects the synthetic canary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe="$RUNNER_TEMP/tmw-gitleaks-probe"
          mkdir -p "$probe"
          printf '%s\n' 'tmw_test_secret_Q7mP4xN9cR2vK6dT8aB5wZ3' > "$probe/canary.txt"
          : > "$probe/report.json"
          image='ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb'
          set +e
          docker run --rm --network=none \
            --volume "$PWD:/repo:ro" \
            --volume "$probe:/probe:rw" \
            "$image" dir --config /repo/.gitleaks.toml --redact \
            --report-format json --report-path /probe/report.json /probe/canary.txt
          scan_status=$?
          set -e
          if [ "$scan_status" -ne 1 ] || ! grep -q 'tmw-deterministic-canary' "$probe/report.json"; then
            echo "Gitleaks did not report the expected canary (exit $scan_status)"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
